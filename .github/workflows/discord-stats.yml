name: discord-stats

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Compute totals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq '[.[].assets[].download_count] | add // 0')
          STARS=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}" | jq '.stargazers_count')
          echo "total=$TOTAL" >> "$GITHUB_ENV"
          echo "stars=$STARS" >> "$GITHUB_ENV"

      - name: Sync Discord stats channels
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD: "1549405279307702426"
          CH_STATS: "1551171654871416964"
          CH_MEMBERS: "1550260910826852393"
        run: |
          MEMBERS=$(curl -sf -H "Authorization: Bot $TOKEN" \
            "https://discord.com/api/v10/guilds/$GUILD?with_counts=true" \
            | jq '.approximate_member_count')
          rename() {
            local ch="$1" name="$2" cur
            cur=$(curl -sf -H "Authorization: Bot $TOKEN" \
              "https://discord.com/api/v10/channels/$ch" | jq -r '.name')
            if [ "$cur" != "$name" ]; then
              jq -n --arg n "$name" '{name:$n}' > ch.json
              curl -sf -X PATCH -H "Authorization: Bot $TOKEN" \
                -H "Content-Type: application/json" -d @ch.json \
                "https://discord.com/api/v10/channels/$ch" -o /dev/null
            fi
          }
          rename "$CH_STATS" "⭐ ${{ env.stars }} stars · ⬇️ ${{ env.total }} dl"
          rename "$CH_MEMBERS" "👥・$MEMBERS membres"
