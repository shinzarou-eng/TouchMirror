name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish win-x64
        run: |
          dotnet publish src/AndroidMirror/TouchMirror.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Package + checksum
        run: |
          $out = "src/AndroidMirror/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish"
          Copy-Item "LICENSE" "$out/LICENSE.txt"
          New-Item -ItemType Directory -Force "$out/engine" | Out-Null
          Copy-Item "engine/LICENSE" "$out/engine/LICENSE"
          Copy-Item "engine/NOTICE.md" "$out/engine/NOTICE.md"
          Copy-Item "licenses" "$out/licenses" -Recurse -Force
          Compress-Archive -Path "$out/*" -DestinationPath "TouchMirror-win-x64.zip" -Force
          (Get-FileHash "TouchMirror-win-x64.zip" -Algorithm SHA256).Hash.ToLower() |
            Out-File "TouchMirror-win-x64.zip.sha256" -Encoding ascii -NoNewline

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TouchMirror-win-x64.zip
            TouchMirror-win-x64.zip.sha256
          body_path: .relnotes/${{ github.ref_name }}.md

      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) { Write-Output "webhook non configuré — skip"; exit 0 }
          $tag = "${{ github.ref_name }}"
          $notes = ""
          $notesFile = ".relnotes/$tag.md"
          if (Test-Path $notesFile) {
            $notes = (Get-Content $notesFile -Raw -Encoding utf8).Trim()
            $notes = ($notes -split '\*\*Full Changelog\*\*')[0].Trim()
            if ($notes.Length -gt 3800) { $notes = $notes.Substring(0, 3800) + "…" }
          }
          $body = @{
            content = "<@&1550260812650651759>"
            allowed_mentions = @{ roles = @("1550260812650651759") }
            embeds = @(@{
              title = "🚀 TouchMirror $tag"
              url = "https://github.com/shinzarou-eng/TouchMirror/releases/tag/$tag"
              description = $notes
              color = 5167502
              fields = @(@{
                name = "⬇️ Télécharger"
                value = "[TouchMirror-win-x64.zip](https://github.com/shinzarou-eng/TouchMirror/releases/download/$tag/TouchMirror-win-x64.zip) — décompresse et lance"
                inline = $false
              })
              footer = @{ text = "SHA256 joint dans les assets • Full changelog sur GitHub" }
            })
          } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Uri "${env:DISCORD_WEBHOOK}?wait=true" -Method Post `
            -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8'
